# 把 public/ 丟上 GitHub Pages（靜態鏡像：單人闖關／本機對戰可玩）
#
# 這個 repo 的 GitHub Pages 從來沒有啟用過（API 查 /pages 回 404）。
# 以前的寫法是直接呼叫 actions/configure-pages —— 它在「Pages 沒開」時會 throw，
# 於是整個 workflow 紅叉，看起來像是程式碼壞掉，其實跟程式碼、跟 npm 都無關。
#
# 現在改成兩段式：
#   1. 先用 API 探測 /pages（回 200/404/其他）→ 判斷 Pages 是否已啟用、來源是不是 GitHub Actions
#   2. **只有確認已啟用才呼叫 configure-pages**（沒開就整段跳過，連 annotation 都不會產生）
# 結果：
#   - Pages 沒開  → job 綠燈、deploy 跳過、summary 寫清楚怎麼開（零紅叉、零 error annotation）
#   - Pages 已開  → 照常自動部署
#
# 要真的上線只需 repo 主人做一次：
#   Repo → Settings → Pages → Build and deployment → Source 選「GitHub Actions」
name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.pages.outcome }}
    steps:
      - uses: actions/checkout@v7

      # ── 1. 探測：Pages 有沒有開？來源是不是「GitHub Actions」？ ──────────────
      - name: 探測 GitHub Pages 狀態
        id: probe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pages"
          code=$(curl -s -o /tmp/pages.json -w '%{http_code}' \
                   -H "Authorization: Bearer ${GH_TOKEN}" \
                   -H "Accept: application/vnd.github+json" \
                   "$api" || echo 000)
          echo "GET ${api} → HTTP ${code}"

          state=unknown
          build_type=""
          if [ "$code" = "200" ]; then
            build_type=$(python3 -c "import json;print(json.load(open('/tmp/pages.json')).get('build_type',''))" 2>/dev/null || echo "")
            if [ "$build_type" = "workflow" ]; then state=workflow
            else state=legacy; fi
            python3 -c "import json;d=json.load(open('/tmp/pages.json'));print('  html_url:',d.get('html_url'));print('  build_type:',d.get('build_type'));print('  status:',d.get('status'))" 2>/dev/null || true
          elif [ "$code" = "404" ]; then
            state=missing
          fi

          echo "state=${state}" >> "$GITHUB_OUTPUT"
          echo "build_type=${build_type}" >> "$GITHUB_OUTPUT"
          echo "code=${code}" >> "$GITHUB_OUTPUT"

      # ── 2. 讓「Build」這一步真的有意義（純靜態專案也要驗一致性）─────────────
      - name: 驗證靜態檔（版本號 / sw.js / public 齊全）
        run: node tools/build-static.js

      # ── 3. Pages 未開啟（或來源不是 Actions）→ 說明，不紅叉 ─────────────────
      - name: Pages 未就緒 → 寫入說明（不是程式碼錯誤）
        if: steps.probe.outputs.state != 'workflow'
        env:
          STATE: ${{ steps.probe.outputs.state }}
          CODE: ${{ steps.probe.outputs.code }}
          BUILD_TYPE: ${{ steps.probe.outputs.build_type }}
        run: |
          set -u
          case "$STATE" in
            missing)  headline="GitHub Pages 尚未啟用，這次沒有部署"        ; detail="從未啟用（GET /pages 回 HTTP ${CODE}）" ;;
            legacy)   headline="Pages 已啟用，但來源不是 GitHub Actions"    ; detail="目前來源是分支（build_type=${BUILD_TYPE}），這個 workflow 不負責部署" ;;
            *)        headline="無法確認 Pages 狀態，這次沒有部署"          ; detail="GET /pages 回 HTTP ${CODE}（可能是 token 權限不足）" ;;
          esac

          echo "::warning title=${headline}::${detail}。正式站 Render 不受影響。"
          {
            echo "### ✅ 建置通過（本專案是純靜態單檔，不需要打包）"
            echo ""
            echo "| 項目 | 狀態 |"
            echo "|---|---|"
            echo "| 版本／sw.js／public 一致性 | ✅ 已驗證（\`node tools/build-static.js\`） |"
            echo "| GitHub Pages | ⚠️ ${detail} |"
            echo "| 正式站 Render | ✅ 正常（https://bomb-hero-game.onrender.com/） |"
            echo ""
            echo "### ⚠️ ${headline}"
            echo ""
            echo "**開啟方式（只需一次）**：[Settings → Pages](https://github.com/${GITHUB_REPOSITORY}/settings/pages)"
            echo ""
            echo "1. Build and deployment → **Source** 選 \`GitHub Actions\`"
            echo "2. 回到 [Actions](https://github.com/${GITHUB_REPOSITORY}/actions/workflows/pages.yml) → **Run workflow** 重跑一次"
            echo ""
            echo "> 註：\`actions/configure-pages\` 的 \`enablement: true\` 需要 PAT（預設 \`GITHUB_TOKEN\` 不能用），"
            echo "> 所以「啟用 Pages」這一步無法由 workflow 自己完成。"
          } >> "$GITHUB_STEP_SUMMARY"

      # ── 4. 確認已就緒才呼叫 configure-pages（否則它會 throw → 產生 error annotation）
      - name: 設定 Pages
        id: pages
        if: steps.probe.outputs.state == 'workflow'
        uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        if: steps.pages.outcome == 'success'
        with:
          path: ./public

  deploy:
    needs: build
    if: needs.build.outputs.ready == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
