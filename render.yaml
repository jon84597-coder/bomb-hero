# Render Blueprint —— 讓帳號／雲端進度在「重新部署（改版）」後不會消失
#
# 問題（v4.13 修）：Render 免費方案的檔案系統是「暫時的」，
#   每次推送新版本重新部署 → data/ 會被清空 → 已註冊的帳號全部消失、必須重新註冊。
#
# 修法：這個 blueprint 會
#   1. 建立一顆 1GB 的持久磁碟，掛載到 /data
#   2. 設定 BH_DATA_DIR=/data → 伺服器把帳號存到磁碟上而不是暫時磁碟
#   3. 設定 BH_AUTH_SECRET → session 簽章密鑰在重新部署後仍然有效（不會被登出）
#
# 套用方式：Render 後台 → 你的服務 → Blueprint → 點「Apply」→ 勾選「Update Existing Resources」
#
# 若不想用 Blueprint，也可以手動做：
#   Render 後台 → Disks → 建立磁碟（掛載到 /data）
#   Render 後台 → Environment → 加 BH_DATA_DIR=/data
#   （BH_AUTH_SECRET 若已設定就會保留；若沒有，伺服器會自動寫一份到 /data/secret.key）

services:
  - type: web
    name: bomb-hero-game
    runtime: node
    plan: free
    buildCommand: ""
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "18"
      # ↓↓↓ 持久磁碟：帳號與雲端進度放這裡，改版重新部署不會不見
      - key: BH_DATA_DIR
        value: /data
      # ↓↓↓ session 簽章密鑰：重新部署後仍然有效（不會被強制登出）
      - key: BH_AUTH_SECRET
        generateValue: true
      # 第三方登入（不填＝那些按鈕變灰，其他功能照常）
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: LINE_CHANNEL_ID
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
    disk:
      name: bomb-hero-data
      mountPath: /data
      sizeGB: 1
