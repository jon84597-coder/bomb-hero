# Render Blueprint —— 帳號／雲端進度要放在哪裡
#
# v4.13 的做法（已廢棄）：掛一顆 1GB 持久磁碟到 /data。
#   ✗ Render 免費實例「不支援持久磁碟」，plan: free + disk 是無效組合；
#   ✗ 但程式看到 BH_DATA_DIR=/data 就以為已經持久化 → 不印警告 → 資料無聲消失。
#   ✗ 而且免費實例 15 分鐘沒流量就休眠，休眠時容器檔案系統會被清空。
#
# v4.85 起的做法：權威來源 = Supabase（Postgres），本機 /data 只當快取。
#   要生效必須在 Render 後台填兩個環境變數：
#     BH_SUPABASE_URL = https://<project-ref>.supabase.co
#     BH_SUPABASE_KEY = sb_secret_…（Secret key，不是 publishable）
#   ⚠ 金鑰不要寫進這個檔案 —— repo 是公開的，會被掃描。
#
# 驗證方式：curl https://bomb-hero-game.onrender.com/api/health
#   "storage": "supabase" 且 "storageLoaded": true 才算接上。

services:
  - type: web
    name: bomb-hero-game
    runtime: node
    plan: free
    # v4.90：Auto-Deploy 開關。後台 Settings → Build & Deploy 如果是灰的
    #（服務由 Blueprint 管理時會唯讀），就靠這一行；push 到 main 即自動部署。
    # 只想改文件不想重啟時，commit 訊息加 [skip render]。
    autoDeploy: true
    buildCommand: ""
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "18"
      # ↓↓↓ v4.85：真正的持久化在 Supabase（免費方案不支援持久磁碟）
      #     填了這兩個，存檔就住在雲端資料庫，休眠／重新部署／換主機都不會消失。
      #     沒填 → 只能寫本機暫存檔，平台一清空容器就沒了（啟動日誌會警告）。
      - key: BH_SUPABASE_URL
        sync: false
      - key: BH_SUPABASE_KEY
        sync: false
      # 本機快取目錄（加速啟動用；不是權威來源，清掉也沒關係）
      - key: BH_DATA_DIR
        value: /data
      # ↓↓↓ session 簽章密鑰：重新部署後仍然有效（不會被強制登出）
      - key: BH_AUTH_SECRET
        generateValue: true
      # 第三方登入（不填＝那些按鈕變灰，其他功能照常）
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: LINE_CHANNEL_ID
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
    # 注意（v4.85）：這裡刻意「不」宣告 disk。
    #   Render 的 free 實例不支援持久磁碟，舊版藍圖寫了 disk + plan: free 是無效組合，
    #   但程式看到 BH_DATA_DIR=/data 就以為已經持久化 → 資料無聲消失。
    #   現在權威來源是 Supabase；若日後升級付費方案要掛盤，再取消下面註解。
    # disk:
    #   name: bomb-hero-data
    #   mountPath: /data
    #   sizeGB: 1
