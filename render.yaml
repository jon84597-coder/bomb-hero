# Render Blueprint —— 讓帳號／雲端進度在「重新部署（改版）」後不會消失
#
# 問題（v4.13 修）：Render 免費方案的檔案系統是「暫時的」，
#   每次推送新版本重新部署 → data/ 會被清空 → 已註冊的帳號全部消失、必須重新註冊。
#
# 修法：這個 blueprint 會
#   1. 建立一顆 1GB 的持久磁碟，掛載到 /data
#   2. 設定 BH_DATA_DIR=/data → 伺服器把帳號存到磁碟上而不是暫時磁碟
#   3. 設定 BH_AUTH_SECRET → session 簽章密鑰在重新部署後仍然有效（不會被登出）
#
# 套用方式：Render 後台 → 你的服務 → Blueprint → 點「Apply」→ 勾選「Update Existing Resources」
#
# 若不想用 Blueprint，也可以手動做：
#   Render 後台 → Disks → 建立磁碟（掛載到 /data）
#   Render 後台 → Environment → 加 BH_DATA_DIR=/data
#   （BH_AUTH_SECRET 若已設定就會保留；若沒有，伺服器會自動寫一份到 /data/secret.key）

services:
  - type: web
    name: bomb-hero-game
    runtime: node
    plan: free
    buildCommand: ""
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "18"
      # ↓↓↓ v4.85：真正的持久化在 Supabase（免費方案不支援持久磁碟）
      #     填了這兩個，存檔就住在雲端資料庫，休眠／重新部署／換主機都不會消失。
      #     沒填 → 只能寫本機暫存檔，平台一清空容器就沒了（啟動日誌會警告）。
      - key: BH_SUPABASE_URL
        sync: false
      - key: BH_SUPABASE_KEY
        sync: false
      # 本機快取目錄（加速啟動用；不是權威來源，清掉也沒關係）
      - key: BH_DATA_DIR
        value: /data
      # ↓↓↓ session 簽章密鑰：重新部署後仍然有效（不會被強制登出）
      - key: BH_AUTH_SECRET
        generateValue: true
      # 第三方登入（不填＝那些按鈕變灰，其他功能照常）
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: LINE_CHANNEL_ID
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
    # 注意（v4.85）：這裡刻意「不」宣告 disk。
    #   Render 的 free 實例不支援持久磁碟，舊版藍圖寫了 disk + plan: free 是無效組合，
    #   但程式看到 BH_DATA_DIR=/data 就以為已經持久化 → 資料無聲消失。
    #   現在權威來源是 Supabase；若日後升級付費方案要掛盤，再取消下面註解。
    # disk:
    #   name: bomb-hero-data
    #   mountPath: /data
    #   sizeGB: 1
