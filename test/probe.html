<!doctype html><meta charset="utf-8">
<style>body{background:#111;color:#0f0;font:14px monospace;white-space:pre-wrap}</style>
<div id="log">loading...</div>
<script>
const log = document.getElementById('log');
let lines = [];
function say(s){ lines.push(s); log.textContent = lines.join('\n'); }
window.onerror = function(m, s, l, c){ say('ERROR: ' + m + ' @' + l + ':' + c); };
window.addEventListener('unhandledrejection', e => say('REJECT: ' + e.reason));
const f = document.createElement('iframe');
f.src = '../index.html';
f.style.cssText = 'width:1100px;height:600px;border:1px solid #444';
f.onload = () => say('iframe loaded');
f.onerror = () => say('iframe error');
document.body.appendChild(f);
setTimeout(()=>say('alive ' + Date.now()), 1500);
</script>
